name: Build PDF
on:
  push:
    branches: ["**"]
    tags: ["v*"]
  pull_request:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    container: registry.fedoraproject.org/fedora:latest # same system as your distrobox
    steps:
      - name: Install TeX Live (same packages as locally)
        run: |
          dnf install -y git texlive-scheme-basic latexmk biber \
            'tex(amsmath.sty)' 'tex(amssymb.sty)' 'tex(amsthm.sty)' \
            'tex(thmtools.sty)' 'tex(xcolor.sty)' 'tex(hyperref.sty)' \
            'tex(cleveref.sty)' 'tex(biblatex.sty)' 'tex(enumitem.sty)'

      - uses: actions/checkout@v4

      - name: Build
        run: latexmk

      - uses: actions/upload-artifact@v5
        with:
          name: pazk-solutions
          path: build/main.pdf
          if-no-files-found: error
      - name: Publish release (only on tags v*)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v3
        with:
          files: build/main.pdf
